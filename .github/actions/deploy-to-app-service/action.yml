# One deploy, whichever the environment: write that environment's settings on
# its App Service app, have the app run the given image, then wait until that
# image answers. Every environment deploys through here, with its own app and
# its own secrets.
#
# The caller is already logged in to Azure (azure/login), as the GitHub
# Environment it runs in.
name: Deploy to App Service
description: Run one image on one environment's App Service app, with that environment's settings.

inputs:
  image:
    description: The image to run, tagged with the commit it was built from.
    required: true
  resource-group:
    description: The resource group holding the app.
    required: true
  app-name:
    description: The environment's App Service app.
    required: true
  secret-key:
    description: The environment's own SECRET_KEY, which signs the session cookie.
    required: true
  dev-login-key:
    description: The environment's own DEV_LOGIN_KEY, which opens the dev sign-in.
    required: true
  mistral-api-key:
    description: MISTRAL_API_KEY, the key of the default LLM provider.
    required: true
  provider-base-url:
    description: DEFAULT_PROVIDER_BASE_URL, where the default LLM provider is called.
    required: false
    default: https://api.mistral.ai/v1

runs:
  using: composite
  steps:
    # Written at every deploy, so that the GitHub Environment stays the one
    # place a setting is changed. --output none: the command would otherwise
    # print every setting back, secrets included.
    #
    # - WEBSITES_PORT: uvicorn listens on 8000, not on the 80 App Service expects.
    # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false: the SQLite file stays on the
    #   container's own disk. /home, App Service's lasting storage, is a network
    #   share on which SQLite cannot take its locks, and the summaries daemon
    #   writes the same file as the web server. The database is seeded again at
    #   every start (README, "Deploying on Azure App Service").
    # - AUTH_MODE=dev: these environments hold generated data and no real users;
    #   the dev sign-in is guarded by the environment's own DEV_LOGIN_KEY.
    # - RUN_SUMMARIES_DAEMON=1: the container is the only process that runs, so
    #   it starts the summaries daemon beside uvicorn, as launch.sh started both.
    # - DEFAULT_PROVIDER_*: the LLM, set here and not in the admin, which each
    #   start resets. Mistral answers as OpenAI's API does. The seed keeps the
    #   row's name; KEY_ENV is the name of the key's setting, never its value.
    - name: Write this environment's settings
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        SECRET_KEY: ${{ inputs.secret-key }}
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        PROVIDER_BASE_URL: ${{ inputs.provider-base-url }}
      run: |
        for name in SECRET_KEY DEV_LOGIN_KEY MISTRAL_API_KEY; do
          if [ -z "${!name}" ]; then
            echo "$name is empty: set it as a secret of this GitHub Environment" >&2
            exit 1
          fi
        done
        az webapp config appsettings set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --settings \
            WEBSITES_PORT=8000 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
            AUTH_MODE=dev \
            RUN_SUMMARIES_DAEMON=1 \
            "SECRET_KEY=$SECRET_KEY" \
            "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
            "MISTRAL_API_KEY=$MISTRAL_API_KEY" \
            DEFAULT_PROVIDER_API_TYPE=openai \
            "DEFAULT_PROVIDER_BASE_URL=$PROVIDER_BASE_URL" \
            DEFAULT_PROVIDER_MODEL=ministral-14b-latest \
            DEFAULT_PROVIDER_KEY_ENV=MISTRAL_API_KEY

    # The image is public on GHCR, so the app pulls it without credentials.
    - name: Run the image
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        az webapp config container set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --container-image-name "$IMAGE"
        running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
        if [ "$running" != "DOCKER|$IMAGE" ]; then
          echo "$APP_NAME is set to $running, not $IMAGE" >&2
          exit 1
        fi
        echo "$APP_NAME now runs $IMAGE"

    # App Service keeps serving the previous container until the new one has
    # started, or failed to, so a 200 alone may come from the previous image.
    # Wait until the image just set answers: its X-Revision header is the
    # commit, which is also the image's tag. A container that does not start
    # fails this job, even while the previous one still answers.
    #
    # The limit, 700 s, is twice the slowest start measured on the Project's
    # own staging, 350 s, most of it pulling the image (EPF-MDE/OceENS#169).
    - name: Wait until the new image answers
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        url="https://$APP_NAME.azurewebsites.net/dev/login"
        revision="${IMAGE##*:}"
        limit=700
        start=$(date +%s)
        attempt=0
        while true; do
          attempt=$((attempt + 1))
          answer=$(curl -s -o /dev/null -w '%{http_code} %header{x-revision}' --max-time 30 "$url" || true)
          elapsed=$(( $(date +%s) - start ))
          if [ "$answer" = "200 $revision" ]; then
            echo "$url answers 200 from $revision, ${elapsed} s after the image was set"
            exit 0
          fi
          echo "Attempt $attempt, ${elapsed} s: $url answered ${answer:-nothing}, waiting for 200 $revision"
          if [ "$elapsed" -ge "$limit" ]; then
            echo "$url did not answer 200 from $revision within $limit s" >&2
            exit 1
          fi
          sleep 15
        done
